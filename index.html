<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meniu digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e6; --card:#fffcf6; --ink:#2f271e; --muted:#76695a;
  --deep:#3d3022; --deep2:#2f271e; --gold:#c7a748; --gold-d:#9a7d2c; --line:#e6d9bf; --soft:#efe5d1;
  --beige-d:#e9dcc2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Jost,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.view{display:none;min-height:100vh}
.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
/* model geometric arăbesc (stea în 8 colțuri) */
.pattern{background:var(--beige-d)}
/* ---------- START ---------- */
header{padding:26px 22px 30px;text-align:center;color:var(--deep);position:relative;background:var(--beige-d)}
.brand{display:block;height:190px;width:auto;margin:0 auto 16px;}
#logo-sheikh .lb,.lb{fill:#204977}#logo-sheikh .lg,.lg{fill:#c7a748}
.mini-brand{height:30px;width:auto;flex:none}
.foot-brand{height:34px;display:block;margin:0 auto 8px}
header::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.logo{display:none;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:38px;letter-spacing:.5px;color:var(--gold);margin:10px 0 2px;line-height:1.1}
.logo span{color:#f3ead6}
.tagline{color:var(--deep);opacity:.75;font-size:13px;letter-spacing:2.5px;text-transform:uppercase}
.search{margin:20px auto 0;max-width:520px;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--gold);border-radius:999px;font:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none;box-shadow:0 2px 8px rgba(61,48,34,.06)}
.search input::placeholder{color:#a3968a}
.search input:focus{border-color:var(--gold-d)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gold)}
.sect{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:26px;color:var(--deep);text-align:center;margin:28px 20px 14px;display:flex;align-items:center;justify-content:center;gap:12px}
.sect::before,.sect::after{content:"✦";font-size:12px;color:var(--gold)}
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 22px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.chap{flex:none;width:72%;max-width:320px;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:999px 999px 18px 18px;padding:10px 10px 0;text-align:center;box-shadow:0 8px 22px rgba(61,48,34,.08)}
.chap .art{aspect-ratio:4/4.3;border-radius:999px 999px 10px 10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.chap .art svg,.chap .art img{width:100%;height:100%;display:block;object-fit:cover}
.chap .lbl{padding:14px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.chap .t{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;color:var(--deep)}
.chap .n{font-size:12px;color:var(--gold-d);letter-spacing:1.5px;text-transform:uppercase}
.go{display:none}
.dots{display:flex;justify-content:center;gap:7px;margin:8px 0 4px}
.dots i{width:6px;height:6px;transform:rotate(45deg);background:var(--line);transition:.2s}
.dots i.on{background:var(--gold);width:8px;height:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 22px;max-width:900px;margin:0 auto}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left}
.chip .mini{width:42px;height:46px;border-radius:999px 999px 6px 6px;overflow:hidden;flex:none}
.chip .mini svg,.chip .mini img{width:100%;height:100%;display:block;object-fit:cover}
.chip b{font-weight:500;font-size:15px;color:var(--deep)}
/* ---------- CAPITOL ---------- */
.bar{position:sticky;top:0;z-index:5;color:var(--ink);border-bottom:2px solid var(--gold)}
.bartop{display:flex;align-items:center;gap:10px;padding:14px 14px 6px;max-width:900px;margin:0 auto}
.back{background:var(--card);border:1px solid var(--gold);color:var(--ink);border-radius:999px;padding:6px 13px 6px 9px;display:flex;align-items:center;gap:4px;font-size:14px}
.bartop h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;color:var(--deep);flex:1;text-align:center;margin-right:40px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 14px;max-width:900px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--gold);background:var(--card);color:var(--ink);padding:6px 15px;border-radius:999px;font-size:14px}
.tab.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
main{max-width:900px;margin:0 auto;padding:18px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.item:active{transform:scale(.98)}
.thumb{flex:none;width:92px;height:104px;border-radius:999px 999px 10px 10px;overflow:hidden;background:var(--soft)}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.info{display:flex;flex-direction:column;min-width:0;flex:1;padding-top:4px}
.name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:20px;line-height:1.15;color:var(--deep)}
.desc{color:var(--muted);font-size:13px;line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--line)}
.price{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:var(--gold-d);font-size:21px}
.meta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-family:Jost,sans-serif;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold-d);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.nav2 button{flex:1;border:1px solid var(--gold);background:transparent;color:var(--deep);border-radius:999px;padding:12px;font-size:14px;font-weight:500}
.nav2 button:disabled{visibility:hidden}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
/* ---------- DETALIU ---------- */
.overlay{position:fixed;inset:0;background:rgba(47,39,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{position:relative;background:var(--card);width:100%;max-width:500px;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;animation:up .25s ease;padding:16px 16px 0;border-top:3px solid var(--gold)}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.hero{aspect-ratio:1/1;max-height:52vh;margin:0 auto;border-radius:999px 999px 14px 14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.hero img,.hero svg{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:18px 8px 28px;text-align:center}
.body h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:700;color:var(--deep)}
.body p{color:var(--muted);line-height:1.6;margin-top:8px;font-size:15px}
.body .price{font-size:28px;margin-top:12px;display:block}
.dmeta{margin-top:8px;font-size:12px;color:var(--gold-d);letter-spacing:1.5px;text-transform:uppercase}
.close{position:absolute;top:24px;right:24px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;z-index:2}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 20px 30px}

</style>
</head>

<script>
/* ============ SURSA DATELOR: tabelul Google „Meniu restaurant” ============ */
const SHEET_ID = "1OuJYv9gJ_hjlQH0iiRlIiJieczqrTl_Si_6eep7v-Ls";
const CACHE = "meniu-cache-v1";
let DATA = {}, CAPITOLE = [], PRODUSE = [];

function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ",") { row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && t[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
let cbN = 0;
function readTabJsonp(name){
  // JSONP: funcționează fără restricții CORS
  return new Promise((resolve, reject) => {
    const cb = "__sheetCb" + (++cbN) + "_" + Date.now();
    const sc = document.createElement("script");
    const done = () => { clearTimeout(timer); try { delete window[cb]; } catch(e){ window[cb] = undefined; } sc.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error("timeout")); }, 7000);
    window[cb] = res => {
      done();
      if(!res || res.status === "error" || !res.table){ reject(new Error("Tabelul nu este public")); return; }
      resolve(res.table.rows.map(r => (r.c||[]).map(c => c ? String(c.f ?? c.v ?? "").trim() : "")));
    };
    sc.onerror = () => { done(); reject(new Error("Tabelul nu poate fi citit")); };
    sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
    document.head.appendChild(sc);
  });
}
async function readTabCsv(name){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`, {cache:"no-store", credentials:"omit"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  const t = await r.text(); if(/^\s*</.test(t)) throw new Error("html");
  return parseCSV(t).slice(1).map(r => r.map(v => (v||"").trim()));
}
async function readTabOpen(name){
  const r = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(name)}?t=${Date.now()}`, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  const rows = await r.json(); if(!Array.isArray(rows)) throw new Error("format");
  const H = {"Setări":["Câmp","Valoare"], "Capitole":["Capitol","Poză (link Google Drive)","Afișat (DA/NU)"],
    "Produse":["Capitol","Produs","Descriere / ingrediente","Gramaj","Preț (lei)","Etichetă","Poză (link Google Drive)","Afișat (DA/NU)"]}[name];
  return rows.map(o => (H || Object.keys(o)).map(k => String(o[k] ?? "").trim()));
}
let METHOD = null;
async function readTab(name){
  const methods = METHOD ? [METHOD] : [readTabJsonp, readTabCsv, readTabOpen];
  let last;
  for(const m of methods){
    try { const rows = await m(name); METHOD = m; return rows; }
    catch(e){ last = e; console.warn(m.name, e); }
  }
  if(METHOD){ METHOD = null; return readTab(name); }
  throw last;
}
function imgUrl(v){
  v = (v||"").trim(); if(!v) return "";
  const m = v.match(/\/d\/([\w-]{20,})/) || v.match(/[?&]id=([\w-]{20,})/);
  if(m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`;
  return /^https?:\/\//.test(v) ? v : "";
}
function money(v){
  let s = String(v||"").replace(/lei|ron|\s/gi, "");
  if(s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s); return isNaN(n) ? null : Math.round(n*100)/100;
}
const shown = v => (v||"").trim().toUpperCase() !== "NU";
const slugify = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "capitol";

async function loadSheet(){
  const set = await readTab("Setări"); const [caps, prods] = await Promise.all([readTab("Capitole"), readTab("Produse")]);
  const S = {}; set.forEach(r => S[(r[0]||"").toLowerCase()] = r[1]||"");
  const ids = {}, used = {}, capitole = [];
  caps.forEach(r => {
    const name = r[0]; if(!name || !shown(r[2])) return;
    let id = slugify(name), n = id, i = 2; while(used[n]) n = id + "-" + (i++); used[n] = 1;
    ids[name.toLowerCase()] = n; capitole.push({id:n, name, img:imgUrl(r[1])});
  });
  const produse = prods.filter(r => r[1] && shown(r[7]) && ids[(r[0]||"").toLowerCase()]).map(r => ({
    cat: ids[r[0].toLowerCase()], name:r[1], desc:r[2], meta:r[3], price:money(r[4]), tag:r[5], img:imgUrl(r[6])
  }));
  return {restaurant:S["nume restaurant"]||"", slogan:S["text sub nume"]||"", nota:S["notă final"]||S["nota final"]||"", capitole, produse};
}
function useData(d){ DATA = d; CAPITOLE = d.capitole||[]; PRODUSE = d.produse||[]; applyHeader(); buildHome(); route(); if($("q").value) search(); }

const DOT = (x,y) => `<circle cx="${x}" cy="${y}" r="1.3" fill="#a8862f" stroke="none"/>`;
const ICONS = {
  supa: ICO(`<path d="M28 36h44"/><path d="M30 36c1 10 9 16 20 16s19-6 20-16"/><path d="M43 55.5h14"/><path d="M42 30c-2.5-3 2.5-5 0-8.5"/><path d="M50 30c-2.5-3 2.5-5 0-8.5"/><path d="M58 30c-2.5-3 2.5-5 0-8.5"/>`),
  mezze: ICO(`<circle cx="50" cy="38" r="21"/><circle cx="42" cy="33" r="6.5"/><circle cx="58" cy="33" r="6.5"/><circle cx="50" cy="47" r="6.5"/>${DOT(42,33)}${DOT(58,33)}${DOT(50,47)}`),
  frigarui: ICO(`<g transform="rotate(-30 50 38)"><path d="M17 38h66"/><rect x="30" y="32" width="9" height="12" rx="3"/><rect x="43" y="32" width="9" height="12" rx="3"/><rect x="56" y="32" width="9" height="12" rx="3"/></g><path d="M36 64c-2.5-3 2.5-5 0-8.5"/><path d="M44 66c-2.5-3 2.5-5 0-8.5"/>`),
  pizza: ICO(`<path d="M50 61L30 21q20-8 40 0z"/><path d="M32.6 26q17.4-6 34.8 0"/><circle cx="45" cy="33" r="2.8"/><circle cx="55" cy="38" r="2.8"/><circle cx="49" cy="46" r="2.8"/>`),
  paste: ICO(`<ellipse cx="50" cy="50" rx="27" ry="8"/><ellipse cx="48" cy="43" rx="14" ry="7"/><ellipse cx="48" cy="42" rx="9" ry="4.5"/><ellipse cx="48" cy="41.5" rx="4" ry="2"/><path d="M57 38L70 13"/><path d="M66 11l-2.5 5M70 12.5l-2.5 5M74 14l-2.5 5"/>`),
  salata: ICO(`<path d="M28 38h44"/><path d="M30 38c1 9 9 15 20 15s19-6 20-15"/><path d="M43 56h14"/><path d="M38 38c-1-8 5-13 12-13-1 7-5 12-12 13z"/><path d="M50 38c2-9 9-12 15-10-2 7-8 10-15 10z"/>${DOT(57,32)}`),
  desert: ICO(`<path d="M50 17l19 20-19 20-19-20z"/><path d="M50 25l11.5 12L50 49 38.5 37z"/><path d="M50 32l4.8 5L50 42l-4.8-5z"/><path d="M30 62h40"/>`),
  bauturi: ICO(`<path d="M38 18l3 41h18l3-41"/><path d="M39.6 31h20.8"/><path d="M55 11l-4 26"/><path d="M61 19c4-4.5 9.5-3.5 10.5 0-4 3.5-8.5 3.5-10.5 0z"/>`),
  cafea: ICO(`<path d="M34 30h28v7c0 9-6 15-14 15s-14-6-14-15z"/><path d="M62 33c6.5 0 6.5 10 0 10"/><path d="M30 58h40"/><path d="M44 24c-2.5-3 2.5-5 0-8.5"/><path d="M52 24c-2.5-3 2.5-5 0-8.5"/>`),
  wrap: ICO(`<path d="M39 24l5 37h12l5-37"/><path d="M39 24c3-6 6.5-6 11 0 4.5-6 8-6 11 0"/><path d="M40.6 36h18.8"/><path d="M41.8 45l17-9M43 54l15.6-9"/>`),
  meniu: ICO(`<circle cx="50" cy="37" r="17"/><circle cx="50" cy="37" r="11.5"/><path d="M25 22v8c0 2.5 1.5 3.5 3 3.5s3-1 3-3.5v-8M28 33.5V55"/><path d="M73 22c4.5 3 4.5 13 0 15v18"/>`)
};
function artFor(id){
  const k = (id || "").toLowerCase();
  if(/sup|cior|soup|borș|bors/.test(k)) return ICONS.supa;
  if(/rece|reci|mezze|meze|cold|hummus|humus/.test(k)) return ICONS.mezze;
  if(/cald|grill|gratar|kebab|frigar|carne|hot/.test(k)) return ICONS.frigarui;
  if(/pizza/.test(k)) return ICONS.pizza;
  if(/past|spag|penne/.test(k)) return ICONS.paste;
  if(/salat/.test(k)) return ICONS.salata;
  if(/desert|dulc|bakl|prajit|sweet/.test(k)) return ICONS.desert;
  if(/cafe|coffee|ceai|tea/.test(k)) return ICONS.cafea;
  if(/shaorm|shawarm|wrap|falafel|sandv/.test(k)) return ICONS.wrap;
  if(/bautur|drink|bar|limonad|suc|vin|bere/.test(k)) return ICONS.bauturi;
  return ICONS.meniu;
}
function applyHeader(){
  document.title = DATA.restaurant ? DATA.restaurant + " · Meniu" : "Meniu";
  const w = (DATA.restaurant||"Meniu").trim().split(/\s+/), last = w.pop();
  document.querySelector(".logo").innerHTML = (w.length ? E(w.join(" "))+" " : "") + "<span>"+E(last)+"</span>";
  document.querySelector(".tagline").textContent = DATA.slogan || "";
  document.getElementById("foot-txt").textContent = DATA.nota || "";
}

const $ = id => document.getElementById(id);
const E = t => String(t??"").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const capById = id => CAPITOLE.find(c=>c.id===id);
const prodOf = id => PRODUSE.filter(p=>p.cat===id);
const cover = id => { const c = capById(id); return c && c.img ? `<img src="${c.img}" alt="">` : artFor(id); };
const pic = p => p.img ? `<img src="${p.img}" alt="">` : artFor(p.cat);
const lei = n => n===null||n===undefined ? "" : (Number.isInteger(n)? n : n.toFixed(2).replace(".",",")) + " lei";
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const prodWord = n => n===1 ? "1 produs" : n+" produse";
let current = null;

function itemHTML(p){
  const i = PRODUSE.indexOf(p);
  return `<button class="item" data-i="${i}">
    <div class="thumb">${pic(p)}</div>
    <div class="info">
      <div class="name">${E(p.name)}${p.tag?`<span class="badge">${E(p.tag)}</span>`:""}</div>
      <div class="desc">${E(p.desc)}</div>
      <div class="row"><span class="meta">${E(p.meta)}</span><span class="price">${lei(p.price)}</span></div>
    </div></button>`;
}

/* ---- START ---- */
function buildHome(){
  $("car").innerHTML = CAPITOLE.map(c=>`
    <button class="chap" data-c="${c.id}">
      <div class="art">${cover(c.id)}</div>
      <div class="lbl"><div><div class="t">${E(c.name)}</div><div class="n">${prodWord(prodOf(c.id).length)}</div></div>
      <span class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></span></div>
    </button>`).join("");
  $("dots").innerHTML = CAPITOLE.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("");
  $("chips").innerHTML = CAPITOLE.map(c=>`<button class="chip" data-c="${c.id}"><span class="mini">${cover(c.id)}</span><b>${E(c.name)}</b></button>`).join("");
}
$("car").addEventListener("scroll",()=>{
  const car=$("car"), cards=car.children; if(!cards.length) return;
  const mid = car.scrollLeft + car.clientWidth/2;
  let best=0, bd=1e9;
  [...cards].forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid); if(d<bd){bd=d;best=i;}});
  [...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===best));
},{passive:true});

function search(){
  const q = norm($("q").value.trim());
  $("home-chapters").hidden = !!q;
  $("results").hidden = !q;
  if(!q) return;
  const hits = PRODUSE.filter(p=>norm(p.name+" "+p.desc).includes(q));
  $("results").innerHTML = hits.length ? `<div class="grid">${hits.map(itemHTML).join("")}</div>` : `<div class="empty">Niciun produs găsit.</div>`;
}

/* ---- CAPITOL ---- */
function showCat(id){
  const c = capById(id); if(!c) return showHome();
  current = id;
  const idx = CAPITOLE.indexOf(c);
  $("cat-title").textContent = c.name;
  $("tabs").innerHTML = CAPITOLE.map(x=>`<button class="tab ${x.id===id?"on":""}" data-c="${x.id}">${E(x.name)}</button>`).join("");
  const list = prodOf(id);
  $("list").innerHTML = list.length ? list.map(itemHTML).join("") : `<div class="empty">În curând.</div>`;
  const pv = CAPITOLE[idx-1], nx = CAPITOLE[idx+1];
  $("prev").disabled = !pv; $("prev").textContent = pv ? "← "+pv.name : "";
  $("next").disabled = !nx; $("next").textContent = nx ? nx.name+" →" : "";
  $("prev").dataset.c = pv?pv.id:""; $("next").dataset.c = nx?nx.id:"";
  setView("v-cat");
  const on = $("tabs").querySelector(".on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo(0,0);
}
function showHome(){ current=null; setView("v-home"); }
function setView(v){ document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id===v)); }

/* Navigare prin #capitol (butonul „înapoi” al telefonului funcționează) */
function go(id){ if(location.hash !== "#"+id) location.hash = id; else route(); }
function route(){ const h = location.hash.slice(1); h && capById(h) ? showCat(h) : showHome(); }
window.addEventListener("hashchange", route);

document.addEventListener("click", e=>{
  const c = e.target.closest("[data-c]");
  if(c && c.dataset.c){ go(c.dataset.c); return; }
  const it = e.target.closest(".item");
  if(it) openItem(+it.dataset.i);
});
$("back").onclick = ()=>{ location.hash = "meniu"; };
$("q").oninput = search;

/* Glisare stânga/dreapta pe pagina capitolului */
let sx=0, sy=0;
$("v-cat").addEventListener("touchstart",e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
$("v-cat").addEventListener("touchend",e=>{
  if(e.target.closest(".tabs")) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){
    const idx = CAPITOLE.findIndex(c=>c.id===current);
    const t = CAPITOLE[idx + (dx<0?1:-1)];
    if(t) go(t.id);
  }
},{passive:true});

/* ---- DETALIU PRODUS ---- */
function openItem(i){
  const p = PRODUSE[i];
  $("d-img").innerHTML = pic(p);
  $("d-name").textContent = p.name;
  $("d-desc").textContent = p.desc || "";
  $("d-meta").textContent = p.meta || "";
  $("d-price").textContent = lei(p.price);
  $("ov").classList.add("open");
}
const closeItem = ()=>$("ov").classList.remove("open");
$("x").onclick = closeItem;
$("ov").onclick = e=>{ if(e.target.id==="ov") closeItem(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeItem(); });

(async function start(){
  setView("v-home");
  let cached = null, shownAny = false; const errs = [];
  try { cached = JSON.parse(localStorage.getItem(CACHE)); } catch(e){}
  if(cached){ useData(cached); shownAny = true; }
  else $("car").innerHTML = `<div class="empty" style="width:100%">Se încarcă meniul…</div>`;
  const save = d => { try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch(e){} };
  // 1) copia de lângă pagină (data.json, actualizată automat de GitHub) — merge în orice browser
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(r.ok){ const d = await r.json(); if(d && d.capitole){ useData(d); save(d); shownAny = true; } }
    else errs.push("data.json " + r.status);
  } catch(e){ errs.push("data.json " + (e.message||e)); }
  // 2) direct din tabel (actualizare imediată, unde browserul permite)
  try { const d = await loadSheet(); useData(d); save(d); shownAny = true; }
  catch(e){ errs.push("tabel " + (e.message||e)); }
  if(!shownAny) $("car").innerHTML = `<div class="empty" style="width:100%">Meniul nu s-a putut încărca. Reîncărcați pagina în câteva momente.<br><small style="opacity:.6">${E(errs.join(" · "))}</small></div>`;
})();
</script>
</body>
</html>
