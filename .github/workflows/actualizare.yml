
{
 "name": "Actualizare meniu din tabel",
 "on": {
  "schedule": [
   {
    "cron": "*/10 * * * *"
   }
  ],
  "workflow_dispatch": null
 },
 "permissions": {
  "contents": "write"
 },
 "concurrency": {
  "group": "actualizare-meniu",
  "cancel-in-progress": true
 },
 "jobs": {
  "update": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Citește tabelul Google și scrie data.json",
     "shell": "python",
     "run": "import csv, io, json, re, unicodedata, urllib.parse, urllib.request\nSHEET_ID = \"1OuJYv9gJ_hjlQH0iiRlIiJieczqrTl_Si_6eep7v-Ls\"\n\ndef tab(name):\n    url = (\"https://docs.google.com/spreadsheets/d/%s/gviz/tq?tqx=out:csv&headers=1&sheet=%s\"\n           % (SHEET_ID, urllib.parse.quote(name)))\n    txt = urllib.request.urlopen(url, timeout=30).read().decode(\"utf-8\")\n    if txt.lstrip().startswith(\"<\"):\n        raise SystemExit(\"Tabelul nu este public\")\n    rows = list(csv.reader(io.StringIO(txt)))[1:]\n    return [[(v or \"\").strip() for v in r] for r in rows]\n\ndef col(r, i):\n    return r[i] if i < len(r) else \"\"\n\ndef slug(s):\n    s = unicodedata.normalize(\"NFD\", (s or \"\").lower())\n    s = \"\".join(c for c in s if unicodedata.category(c) != \"Mn\")\n    s = re.sub(r\"[^a-z0-9]+\", \"-\", s).strip(\"-\")\n    return s or \"capitol\"\n\ndef img(v):\n    v = (v or \"\").strip()\n    m = re.search(r\"/d/([\\w-]{20,})\", v) or re.search(r\"[?&]id=([\\w-]{20,})\", v)\n    if m:\n        return \"https://drive.google.com/thumbnail?id=%s&sz=w1000\" % m.group(1)\n    return v if re.match(r\"^https?://\", v) else \"\"\n\ndef money(v):\n    s = re.sub(r\"(?i)lei|ron|\\s\", \"\", v or \"\")\n    if \",\" in s:\n        s = s.replace(\".\", \"\").replace(\",\", \".\")\n    try:\n        return round(float(s), 2)\n    except ValueError:\n        return None\n\nshown = lambda v: (v or \"\").strip().upper() != \"NU\"\n\nsetari = {col(r, 0).lower(): col(r, 1) for r in tab(\"Setări\")}\nids, used, capitole = {}, set(), []\nfor r in tab(\"Capitole\"):\n    name = col(r, 0)\n    if not name or not shown(col(r, 2)):\n        continue\n    base = slug(name); n = base; i = 2\n    while n in used:\n        n = \"%s-%d\" % (base, i); i += 1\n    used.add(n); ids[name.lower()] = n\n    capitole.append({\"id\": n, \"name\": name, \"img\": img(col(r, 1))})\nproduse = []\nfor r in tab(\"Produse\"):\n    cat = ids.get(col(r, 0).lower())\n    if not col(r, 1) or not cat or not shown(col(r, 7)):\n        continue\n    produse.append({\"cat\": cat, \"name\": col(r, 1), \"desc\": col(r, 2), \"meta\": col(r, 3),\n                    \"price\": money(col(r, 4)), \"tag\": col(r, 5), \"img\": img(col(r, 6))})\ndata = {\"restaurant\": setari.get(\"nume restaurant\", \"\"), \"slogan\": setari.get(\"text sub nume\", \"\"),\n        \"nota\": setari.get(\"notă final\", setari.get(\"nota final\", \"\")),\n        \"capitole\": capitole, \"produse\": produse}\nwith open(\"data.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, ensure_ascii=False, indent=1)\nprint(\"Capitole:\", len(capitole), \"Produse:\", len(produse))\n"
    },
    {
     "name": "Salvează dacă s-a schimbat ceva",
     "run": "git config user.name \"actualizare-meniu\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit add data.json\ngit diff --cached --quiet || (git commit -m \"Meniu actualizat din tabel\" && git push)\n"
    }
   ]
  }
 }
}
